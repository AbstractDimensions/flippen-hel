title: "FLIPpen Hel - Atmel FLIP alternative"
description: "A zero-install Atmel FLIP alternative for AT89LP51RD2 and AT89C51RD2. One-click hex installs, built-in serial monitor, firmware reset over UART, and a headless CLI."
url: "https://abstractdimensions.github.io"
baseurl: "/flippen-hel"
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

color_scheme: dark
logo: "/assets/img/logo.png"
favicon_ico: "/assets/img/favicon.ico"

aux_links:
  "Download FlipRunner.ps1": "https://github.com/AbstractDimensions/flippen-hel/releases/latest/download/FlipRunner.ps1"

aux_links_new_tab: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Copyright <a href="https://github.com/AbstractDimensions/flippen-hel">FLIPpen Hel</a>. Fillip the flip-flop approves.'

last_edit_toggle: false

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green

nav:
  - title: Home
    url: "/"
  - title: Getting started
    url: "getting-started"
  - title: Atmel FLIP alternative
    url: "atmel-flip-alternative"
  - title: Features
    url: "features"
  - title: The GUI
    url: "gui"
  - title: Headless CLI
    url: "cli"
  - title: Firmware reset
    url: "firmware-reset"
  - title: Wiring
    url: "wiring"
  - title: FAQ
    url: "faq"
